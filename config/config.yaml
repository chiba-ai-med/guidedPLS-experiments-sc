# =============================================================================
# guided-PLS scRNA-Seq / scATAC-Seq 統合実験 設定ファイル
# =============================================================================

# =========================================================================
# データセット定義 — 新規データセット追加時はここを編集
# =========================================================================
datasets:
  Organogenesis:
    guide_conditions:
      # "none" は Y が定数列1のため guidedPLS の SVD 段で退化 — 除外。
      # 「guide を与えない条件」が必要なら Testis 側の shuffled-guide パターンを移植する。
      - "stage"
      - "germlayer"
      - "stage_germlayer"
    comparison_methods:
      - "seurat"
      - "harmony"
      - "scanorama"
    stages: ["E8.5", "E9.5", "E10.5"]

  # Testis (mouse spermatogenesis, ArchR scATAC) は drop。
  # 比較手法が ArchR の barcode 形式と非互換で fair な benchmark が組めず、
  # かつ全体 narrative を PBMC 中心にするため scope 外。
  # 生データ・出力ファイルは `data/Testis/`, `output/Testis/` にそのまま残っている。

  PBMC:
    # 10x Genomics 10k PBMC scMultiome — 同一細胞由来の RNA + ATAC、~11k cells、
    # ~12 celltype。Organogenesis (41 celltype) との対比で「celltype 数が小さい
    # 設定」を検証するためのデータセット。
    guide_conditions:
      - "germlayer"   # broad_lineage (T/B/NK/Myeloid/Other) を germ_layer 列に格納
    comparison_methods:
      - "seurat"
      - "harmony"
      - "scanorama"
    stages: ["PBMC"]

# --- 比較手法のデフォルト (datasetsで未指定の場合) ---
default_comparison_methods:
  - "seurat"
  - "harmony"
  - "scanorama"

# --- 前処理パラメータ ---
subsample_n: 10000
min_genes_rna: 500
min_peaks_atac: 500
n_hvg: 3000

# --- guided-PLS パラメータ ---
guidedpls_r: 18
guidedpls_k: 11

# --- 再現性 ---
random_seed: 42
